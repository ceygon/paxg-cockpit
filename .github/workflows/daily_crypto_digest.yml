name: PAXG Daily Crypto Digest

on:
  schedule:
    - cron: '0 21 * * *' # Her gece 00:00 TRT (21:00 UTC)
  workflow_dispatch:     # Manuel tetikleme

jobs:
  daily-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Send Daily Crypto Digest to Telegram
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          python -c "
          import os, requests
          
          bot_token = os.environ.get('TG_BOT_TOKEN')
          chat_id = os.environ.get('TG_CHAT_ID')
          
          if not bot_token or not chat_id:
              print('Telegram credentials missing, skipping.')
              exit(0)
              
          # Fetch live price
          price = 3800.0
          try:
              r = requests.get('https://fapi.binance.com/fapi/v1/ticker/price?symbol=PAXGUSDT', timeout=10)
              price = float(r.json()['price'])
          except Exception as e:
              print('Price fetch error:', e)
              
          size = 6.000
          entry = 4278.0615
          unrealized_pnl = (price - entry) * size
          
          tp1_dist = ((3940.0 - price) / price) * 100
          tp2_dist = ((4085.0 - price) / price) * 100
          
          status_emoji = '🟢' if unrealized_pnl >= 0 else '🟠'
          
          msg = (
              f'📊 *PAXG / USDT Günlük Kapanış Karnesi*\n'
              f'━━━━━━━━━━━━━━━━━━━━\n'
              f'🪙 *Canlı Fiyat:* \`{price:,.2f} $\`\n'
              f'💼 *Toplam Pozisyon:* \`6.000 PAXG\`\n'
              f'📍 *Giriş Başabaş:* \`4,278.06 $\`\n'
              f'{status_emoji} *Net PnL:* \`{unrealized_pnl:+,.2f} $\`\n\n'
              f'🎯 *Hedef Limit Emirler:*\n'
              f'• 1. Hedef (1.000 PAXG): \`3,940.00 $\` (%{tp1_dist:+.2f})\n'
              f'• 2. Hedef (1.319 PAXG): \`4,085.00 $\` (%{tp2_dist:+.2f})\n\n'
              f'🛡️ *Likidasyon:* \`2,444.81 $\` (Güvenli: %35+)\n'
              f'🌐 *Canlı Kokpit:* https://ceygon.github.io/paxg-cockpit/\n'
              f'━━━━━━━━━━━━━━━━━━━━\n'
              f'⚡ _GitHub Actions Otomasyonu (0 TL Sunucu Masrafı)_'
          )
          
          url = f'https://api.telegram.org/bot{bot_token}/sendMessage'
          res = requests.post(url, json={
              'chat_id': chat_id,
              'text': msg,
              'parse_mode': 'Markdown',
              'disable_web_page_preview': False
          })
          print('Telegram response:', res.status_code, res.text)
          "
